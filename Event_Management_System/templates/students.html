{% extends "base.html" %}
{% block content %}
<div class="section-title mb-3"><div><div class="eyebrow">PARTICIPATION</div><h1>Students</h1></div></div>
<div class="card p-4"><div class="table-responsive"><table class="table align-middle">
<thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Year</th><th>Events Registered</th></tr></thead>
<tbody>{% for s in students %}<tr><td><strong>{{s.name}}</strong></td><td>{{s.email}}</td><td>{{s.department}}</td><td>{{s.year_level}}</td><td><span class="badge-soft">{{s.event_count}}</span></td></tr>{% endfor %}</tbody>
</table></div></div>
{% endblock %}
